<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Моя Ферма</title>
<!-- Подключаем стили -->
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <!-- Верхняя панель -->
  <div class="top-ui">
    <div class="res-panel">
      <div>💰 <span id="ui-coins">1000</span></div>
      <div>⚡ <span class="energy" id="ui-energy">20</span></div>
    </div>
  </div>

  <!-- Управление зумом -->
  <div class="zoom-controls">
    <div class="zoom-btn" onclick="changeZoom(0.2)">+</div>
    <div class="zoom-btn" onclick="changeZoom(-0.2)">-</div>
  </div>

  <!-- Нижняя панель (Магазин) -->
  <div class="bottom-ui">
    <div class="shop-btn" onclick="selectBuild('tree')" id="btn-tree">
      <div class="icon">🌳</div>
      <div class="name">Дерево</div>
      <div class="cost">50 💰</div>
    </div>
    <div class="shop-btn" onclick="selectBuild('house')" id="btn-house">
      <div class="icon">🏠</div>
      <div class="name">Дом</div>
      <div class="cost">150 💰</div>
    </div>
    <div class="shop-btn" onclick="selectBuild('farm')" id="btn-farm">
      <div class="icon">🌾</div>
      <div class="name">Ферма</div>
      <div class="cost">300 💰</div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Подключаем логику -->
  <script src="game.js"></script>
</body>
</html>
