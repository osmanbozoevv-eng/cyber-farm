<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Моя Ферма</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body { background: #87CEEB; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ВЕРХНИЙ UI */
  .top-ui {
    position: absolute; top: 15px; left: 15px; right: 15px;
    display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
  }
  .res-panel {
    background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 12px;
    color: #333; font-weight: bold; font-size: 16px;
    border: 2px solid #cbd5e1; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex; gap: 15px; pointer-events: auto;
  }
  .res-panel span { color: #f59e0b; }
  .res-panel .energy { color: #8b5cf6; }

  /* КНОПКИ ЗУМА */
  .zoom-controls {
    position: absolute; right: 15px; top: 70px; display: flex; flex-direction: column; gap: 10px; z-index: 10;
  }
  .zoom-btn {
    width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.9);
    border: 2px solid #cbd5e1; font-size: 20px; font-weight: bold; color: #333;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;
  }
  .zoom-btn:active { background: #e2e8f0; }

  /* НИЖНИЙ UI */
  .bottom-ui {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #f8fafc; border-top: 2px solid #e2e8f0;
    padding: 12px; display: flex; justify-content: space-around; z-index: 10;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.1); border-radius: 20px 20px 0 0;
  }
  .shop-btn {
    display: flex; flex-direction: column; align-items: center;
    background: white; border: 2px solid #cbd5e1; border-radius: 12px;
    padding: 8px; width: 30%; cursor: pointer; transition: all 0.1s;
  }
  .shop-btn.active { border-color: #3b82f6; background: #eff6ff; box-shadow: 0 0 10px rgba(59,130,246,0.3); transform: scale(0.95); }
  .shop-btn .icon { font-size: 24px; margin-bottom: 2px; }
  .shop-btn .name { font-size: 12px; font-weight: bold; color: #1e293b; }
  .shop-btn .cost { font-size: 11px; color: #f59e0b; font-weight: bold; margin-top: 2px; }

  #toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: white; padding: 8px 16px;
    border-radius: 20px; font-weight: bold; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="top-ui">
    <div class="res-panel">
      <div>💰 <span id="ui-coins">1000</span></div>
      <div>⚡ <span class="energy" id="ui-energy">20</span></div>
    </div>
  </div>

  <div class="zoom-controls">
    <div class="zoom-btn" onclick="changeZoom(0.2)">+</div>
    <div class="zoom-btn" onclick="changeZoom(-0.2)">-</div>
  </div>

  <div class="bottom-ui">
    <div class="shop-btn" onclick="selectBuild('tree')" id="btn-tree">
      <div class="icon">🌳</div>
      <div class="name">Дерево</div>
      <div class="cost">50 💰</div>
    </div>
    <div class="shop-btn" onclick="selectBuild('house')" id="btn-house">
      <div class="icon">🏠</div>
      <div class="name">Дом</div>
      <div class="cost">150 💰</div>
    </div>
    <div class="shop-btn" onclick="selectBuild('farm')" id="btn-farm">
      <div class="icon">🌾</div>
      <div class="name">Ферма</div>
      <div class="cost">300 💰</div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const baseTileW = 64; 
  const baseTileH = 32;
  const gridSize = 15; 

  let zoom = 1;
  let panX = 0;
  let panY = 0;

  let state = { coins: 1000, energy: 20, map: {} };
  const PRICES = { tree: 50, house: 150, farm: 300 };
  let selectedTool = null;

  // Загружаем картинку домика (она лежит в этом же репозитории)
  const imgHouse = new Image();
  imgHouse.src = 'house.png';

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    panX = canvas.width / 2;
    panY = canvas.height / 3;
    draw();
  }
  window.addEventListener('resize', resize);

  function isoToScreen(x, y) {
    return {
      x: (x - y) * (baseTileW / 2) * zoom + panX,
      y: (x + y) * (baseTileH / 2) * zoom + panY
    };
  }

  function screenToIso(sx, sy) {
    let x = ((sx - panX) / zoom) / (baseTileW / 2);
    let y = ((sy - panY) / zoom) / (baseTileH / 2);
    return {
      x: Math.round((x + y) / 2),
      y: Math.round((y - x) / 2)
    };
  }

  function changeZoom(delta) {
    zoom = Math.max(0.5, Math.min(2.5, zoom + delta));
    draw();
  }

  function draw() {
    // Небо (голубое)
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Земля (Зеленая трава)
    for (let x = 0; x < gridSize; x++) {
      for (let y = 0; y < gridSize; y++) {
        const pos = isoToScreen(x, y);
        ctx.fillStyle = (x + y) % 2 === 0 ? '#7CFC00' : '#6CD400';
        ctx.strokeStyle = '#55A600';
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineTo(pos.x + (baseTileW/2)*zoom, pos.y + (baseTileH/2)*zoom);
        ctx.lineTo(pos.x, pos.y + baseTileH*zoom);
        ctx.lineTo(pos.x - (baseTileW/2)*zoom, pos.y + (baseTileH/2)*zoom);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }

    // Объекты
    const sorted = Object.keys(state.map).sort((a, b) => {
      const [ax, ay] = a.split(',').map(Number);
      const [bx, by] = b.split(',').map(Number);
      return (ax + ay) - (bx + by);
    });

    sorted.forEach(key => {
      const [x, y] = key.split(',').map(Number);
      const item = state.map[key];
      const pos = isoToScreen(x, y);
      const cw = baseTileW * zoom;
      const ch = baseTileH * zoom;

      if (item.type === 'tree') drawTree(pos.x, pos.y, cw, ch);
      if (item.type === 'house') drawHouse(pos.x, pos.y, cw, ch);
      if (item.type === 'farm') drawFarm(pos.x, pos.y, cw, ch);
    });
  }

  function drawTree(x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + h/2, w*0.4, h*0.2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(x - w*0.05, y - h*0.2, w*0.1, h*0.4);
    ctx.fillStyle = '#228B22';
    ctx.beginPath(); ctx.arc(x, y - h*0.6, w*0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#32CD32';
    ctx.beginPath(); ctx.arc(x - w*0.1, y - h*0.7, w*0.3, 0, Math.PI*2); ctx.fill();
  }

  function drawHouse(x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + h/2, w*0.5, h*0.25, 0, 0, Math.PI*2); ctx.fill();

    if (imgHouse.complete && imgHouse.naturalWidth > 0) {
      const imgW = w * 1.5; 
      const imgH = imgW;    
      ctx.drawImage(imgHouse, x - imgW/2, y + h/2 - imgH*0.8, imgW, imgH);
    } else {
      ctx.fillStyle = '#ccc';
      ctx.fillRect(x - w/2, y - h/2, w, h);
    }
  }

  function drawFarm(x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(x, y + h/2, w*0.5, h*0.25, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w/2, y + h/2);
    ctx.lineTo(x, y + h); ctx.lineTo(x - w/2, y + h/2);
    ctx.fill();
    ctx.fillStyle = '#32CD32';
    ctx.fillRect(x - w*0.2, y + h*0.2, w*0.1, h*0.2);
    ctx.fillRect(x + w*0.1, y + h*0.3, w*0.1, h*0.2);
    ctx.fillRect(x - w*0.05, y + h*0.5, w*0.1, h*0.2);
  }

  let startX, startY, startPanX, startPanY, isDragging = false;

  canvas.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY;
    startPanX = panX; startPanY = panY;
    isDragging = false;
  });

  canvas.addEventListener('pointermove', (e) => {
    if (startX === undefined) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
      isDragging = true;
      panX = startPanX + dx;
      panY = startPanY + dy;
      draw();
    }
  });

  canvas.addEventListener('pointerup', (e) => {
    if (startX === undefined) return;
    if (!isDragging && selectedTool) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      const gridPos = screenToIso(clickX, clickY);

      if (gridPos.x >= 0 && gridPos.x < gridSize && gridPos.y >= 0 && gridPos.y < gridSize) {
        const key = `${gridPos.x},${gridPos.y}`;
        if (state.map[key]) { showToast('❌ Здесь уже занято!'); return; }
        if (state.coins < PRICES[selectedTool]) { showToast('❌ Мало монет!'); return; }

        state.coins -= PRICES[selectedTool];
        state.map[key] = { type: selectedTool };
        updateUI(); draw();
        
        selectedTool = null;
        document.querySelectorAll('.shop-btn').forEach(btn => btn.classList.remove('active'));
      }
    }
    startX = undefined; isDragging = false;
  });

  function selectBuild(type) {
    selectedTool = type;
    document.querySelectorAll('.shop-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${type}`).classList.add('active');
    showToast('Нажми на траву!');
  }

  function updateUI() {
    document.getElementById('ui-coins').textContent = state.coins;
    document.getElementById('ui-energy').textContent = state.energy;
  }

  let toastTimeout;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => { t.style.opacity = '0'; }, 2000);
  }

  resize(); updateUI();
  state.map['5,5'] = { type: 'tree' };
  state.map['6,5'] = { type: 'tree' };
  state.map['5,6'] = { type: 'tree' };
  draw();
</script>
</body>
</html>
